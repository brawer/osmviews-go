name: Bug report
description: Something in the package behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest code that shows the problem. If it depends on a specific
        location or on the dataset, include the coordinates and, if you can, the
        dataset’s Last-Modified date.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Go version and platform
      placeholder: "go1.26.3 darwin/arm64"
    validations:
      required: true
