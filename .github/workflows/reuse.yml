name: REUSE

# No `paths:` filter: adding any file without licensing info breaks compliance,
# so every push and pull request is checked.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The REUSE tool via pipx (preinstalled on GitHub runners), pinned to an
      # exact version, rather than fsfe/reuse-action: the repository's Actions
      # policy may allow only actions by GitHub and verified creators.
      - run: pipx run reuse==6.2.0 lint
